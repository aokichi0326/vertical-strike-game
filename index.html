<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>実写たたきゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="game-frame" aria-label="実写たたきゲーム">
      <header class="hud" aria-live="polite">
        <div class="hud-item">
          <span class="hud-label">スコア</span>
          <strong id="scoreValue">0</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">残り時間</span>
          <strong id="timeValue">20</strong>
        </div>
        <div class="hud-item">
          <span class="hud-label">ライフ</span>
          <strong id="lifeValue">3</strong>
        </div>
      </header>

      <div id="bossHud" class="boss-hud hidden" aria-hidden="true">
        <span>ボスHP</span>
        <div class="boss-bar">
          <div id="bossBarFill" class="boss-bar-fill"></div>
        </div>
      </div>

      <section id="gameArea" class="game-area" aria-label="ゲームエリア">
        <div id="messageBanner" class="message-banner hidden"></div>
      </section>

      <section id="titleOverlay" class="overlay title-overlay">
        <div class="overlay-panel">
          <p class="eyebrow">TAP ACTION</p>
          <h1>実写たたきゲーム</h1>
          <p>出てくる敵をタップして倒そう。20秒後には巨大ボスが出現する。</p>
          <button id="startButton" class="primary-button" type="button">スタート</button>
        </div>
      </section>

      <section id="resultOverlay" class="overlay result-overlay hidden" aria-live="assertive">
        <div class="overlay-panel">
          <p id="resultTitle" class="result-title">クリア！</p>
          <p class="result-score">最終スコア <strong id="finalScoreValue">0</strong></p>
          <button id="restartButton" class="primary-button" type="button">もう一度遊ぶ</button>
        </div>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
