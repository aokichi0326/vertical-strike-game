<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Vertical Strike</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header class="hud">
      <div>SCORE <span id="score">000000</span></div>
      <div>STAGE 1</div>
    </header>

    <section class="game-frame" aria-label="縦スクロールシューティングゲーム">
      <canvas id="gameCanvas" width="420" height="720"></canvas>

      <div id="titleScreen" class="overlay active">
        <h1>VERTICAL STRIKE</h1>
        <p>自動射撃で敵を撃破せよ</p>
        <button id="startButton">START</button>
      </div>

      <div id="gameOverScreen" class="overlay">
        <h2>GAME OVER</h2>
        <p>SCORE <span id="finalScore">000000</span></p>
        <button id="retryButton">RETRY</button>
      </div>

      <div id="clearScreen" class="overlay">
        <h2>STAGE CLEAR</h2>
        <p>SCORE <span id="clearScore">000000</span></p>
        <button id="clearRetryButton">PLAY AGAIN</button>
      </div>
    </section>

    <footer class="touch-hint">ドラッグで移動</footer>
  </main>

  <script src="game.js"></script>
</body>
</html>
